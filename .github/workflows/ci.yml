name: CI

on:
  pull_request:
  push:
    branches: [main]

# Uma execução nova do mesmo PR cancela a anterior; os pushes na main nunca são cancelados, para cada commit ter seu resultado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Hashes publicados em SHA512-SUMS.txt do release do Godot; mudam junto com GODOT_VERSION nos jobs.
env:
  GODOT_ZIP_SHA512: 79229fd112b0c9cbeab82363a4ef7be18ea70f1caf86bf912789335b136fbe7e01db0053a33461438c5da1c680c17bbb10040bd09bedc51221cd4423d0367757
  GODOT_TPZ_SHA512: bb5c41d72370ed743660361f6228006f808ab04ca33abdc545d740b044f3fe057f32ae8cb7873a1bc86ddcd82ae683b9f6dfdfe4179852f2c0f1acde2ff6bd5a

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x
      - name: Rodar os testes
        run: dotnet test game.tests

  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      - name: Formatação
        run: |
          for projeto in core/ArquipelagoDoCeu.Core.csproj game.tests/ArquipelagoDoCeu.Tests.csproj game/ArquipelagoDoCeu.csproj; do
            dotnet format whitespace "$projeto" --verify-no-changes
          done
      - name: Análise estática e auditoria de dependências (aviso vira erro)
        run: |
          dotnet build game/ArquipelagoDoCeu.sln --no-incremental
          dotnet build game.tests/ArquipelagoDoCeu.Tests.csproj --no-incremental
      - name: Testes e cobertura do core (mínimo de 90% das linhas)
        run: dotnet test game.tests -p:CollectCoverage=true "-p:Include=[ArquipelagoDoCeu.Core]*" -p:Threshold=90 -p:ThresholdType=line
      - name: Comentários de no máximo 2 linhas
        run: node tools/check_comments.mjs
      - name: Commits convencionais
        if: github.event_name == 'pull_request'
        run: node tools/check_commits.mjs "origin/${{ github.base_ref }}"

  segredos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  arquivos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: game/.godot,game/assets
          exit-code: '1'

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x
      - name: Instalar o Godot e as templates de exportação
        run: |
          $base = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION-stable"
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_mono_win64.zip" -OutFile godot.zip
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_mono_export_templates.tpz" -OutFile templates.zip
          foreach ($par in @(@("godot.zip", $env:GODOT_ZIP_SHA512), @("templates.zip", $env:GODOT_TPZ_SHA512))) {
            if ((Get-FileHash $par[0] -Algorithm SHA512).Hash -ne $par[1]) { Write-Error "O checksum de $($par[0]) não confere."; exit 1 }
          }
          Expand-Archive godot.zip -DestinationPath "$env:RUNNER_TEMP\godot"
          Expand-Archive templates.zip -DestinationPath "$env:RUNNER_TEMP\templates"
          # O Godot procura as templates numa pasta com o nome exato da versão.
          $destino = "$env:APPDATA\Godot\export_templates\$env:GODOT_VERSION.stable.mono"
          New-Item -ItemType Directory $destino -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP\templates\templates\*" $destino -Recurse
          $console = Get-ChildItem "$env:RUNNER_TEMP\godot" -Recurse -Filter "*_console.exe" | Select-Object -First 1
          "GODOT=$($console.FullName)" >> $env:GITHUB_ENV
      - name: Copiar o conteúdo para o projeto do jogo
        run: |
          New-Item -ItemType Directory game/content -Force | Out-Null
          Copy-Item content/* game/content -Recurse -Force
      - name: Exportar para Windows
        run: |
          New-Item -ItemType Directory build -Force | Out-Null
          & $env:GODOT --headless --path game --import
          $log = & $env:GODOT --headless --path game --export-release "Windows Desktop" 2>&1 | ForEach-Object { $linha = "$_"; Write-Host $linha; $linha }
          # O Godot sai com 0 e gera o executável mesmo com erro na exportação (sem o .sln, o C# fica de fora);
          # por isso a saída é conferida, menos o aviso do plugin de Android em modo headless.
          if ($LASTEXITCODE -ne 0 -or ($log | Where-Object { $_ -match '^ERROR:' -and $_ -notmatch 'shutdown_adb_on_exit' }) -or -not (Test-Path build/ArquipelagoDoCeu.exe)) { Write-Error "A exportação falhou."; exit 1 }
      - name: Abrir o executável exportado
        run: |
          Get-ChildItem build -Recurse | ForEach-Object { $_.FullName.Replace("$PWD\", "") }
          $saida = & build/ArquipelagoDoCeu.console.exe --headless --verbose --quit-after 30 2>&1 | Out-String
          $codigo = $LASTEXITCODE
          Write-Host "Saída ($codigo):"; Write-Host $saida
          if ($codigo -ne 0 -or $saida -notmatch "Cena inicial pronta") { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-build
          path: build/
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x
      - name: Instalar o Godot e as templates de exportação
        run: |
          $base = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION-stable"
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_mono_win64.zip" -OutFile godot.zip
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_mono_export_templates.tpz" -OutFile templates.zip
          foreach ($par in @(@("godot.zip", $env:GODOT_ZIP_SHA512), @("templates.zip", $env:GODOT_TPZ_SHA512))) {
            if ((Get-FileHash $par[0] -Algorithm SHA512).Hash -ne $par[1]) { Write-Error "O checksum de $($par[0]) não confere."; exit 1 }
          }
          Expand-Archive godot.zip -DestinationPath "$env:RUNNER_TEMP\godot"
          Expand-Archive templates.zip -DestinationPath "$env:RUNNER_TEMP\templates"
          $destino = "$env:APPDATA\Godot\export_templates\$env:GODOT_VERSION.stable.mono"
          New-Item -ItemType Directory $destino -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP\templates\templates\*" $destino -Recurse
          $console = Get-ChildItem "$env:RUNNER_TEMP\godot" -Recurse -Filter "*_console.exe" | Select-Object -First 1
          "GODOT=$($console.FullName)" >> $env:GITHUB_ENV
      - name: Copiar o conteúdo para o projeto do jogo
        run: |
          New-Item -ItemType Directory game/content -Force | Out-Null
          Copy-Item content/* game/content -Recurse -Force
      # O roteiro usa o piloto de desenvolvimento, que só existe em build de depuração; por isso este job exporta a versão de depuração.
      - name: Exportar a versão de depuração
        run: |
          New-Item -ItemType Directory build-e2e -Force | Out-Null
          & $env:GODOT --headless --path game --import
          $log = & $env:GODOT --headless --path game --export-debug "Windows Desktop" "../build-e2e/ArquipelagoDoCeu.exe" 2>&1 | ForEach-Object { $linha = "$_"; Write-Host $linha; $linha }
          if ($LASTEXITCODE -ne 0 -or ($log | Where-Object { $_ -match '^ERROR:' -and $_ -notmatch 'shutdown_adb_on_exit' }) -or -not (Test-Path build-e2e/ArquipelagoDoCeu.console.exe)) { Write-Error "A exportação falhou."; exit 1 }
      - name: Teste de ponta a ponta no executável (criar Perfil, andar, treinar nos dois Papéis, fechar e reabrir)
        run: |
          $save = Join-Path $PWD "e2e-save.json"
          Remove-Item $save, "$save.snapshot" -ErrorAction SilentlyContinue
          foreach ($etapa in "e2e-1", "e2e-2") {
            Write-Host "== $etapa"
            & build-e2e/ArquipelagoDoCeu.console.exe --headless -- --driver=$etapa --save=$save
            if ($LASTEXITCODE -ne 0) { Write-Error "A etapa $etapa falhou."; exit 1 }
          }
      - name: Teste de ponta a ponta do Nível 1 (Atalho, as duas torres, Item e Marco, Desafio épico, Desafio mestre; fechar e reabrir)
        run: |
          $save = Join-Path $PWD "e2e-nivel-save.json"
          Remove-Item $save, "$save.snapshot" -ErrorAction SilentlyContinue
          foreach ($etapa in "e2e-3", "e2e-4") {
            Write-Host "== $etapa"
            & build-e2e/ArquipelagoDoCeu.console.exe --headless -- --driver=$etapa --save=$save --seed-do-mundo=1
            if ($LASTEXITCODE -ne 0) { Write-Error "A etapa $etapa falhou."; exit 1 }
          }
      - name: Teste de ponta a ponta dos Andares (escada nos dois sentidos, Andar completo e Cosmético, mapa explorado depois de zerar a Energia)
        run: |
          foreach ($etapa in "torre-andares", "torre-explorado", "torre-profunda", "torre-equipamento") {
            Write-Host "== $etapa"
            $save = Join-Path $PWD "e2e-$etapa-save.json"
            Remove-Item $save, "$save.snapshot" -ErrorAction SilentlyContinue
            & build-e2e/ArquipelagoDoCeu.console.exe --headless -- --driver=$etapa --save=$save --seed-do-mundo=1
            if ($LASTEXITCODE -ne 0) { Write-Error "A etapa $etapa falhou."; exit 1 }
          }
